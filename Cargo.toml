[package]
name = "nano-agent"
version = "0.4.0"
edition = "2024"

[features]
default = []
acp = ["dep:agent-client-protocol"]

[dependencies]
agent-client-protocol = { version = "0.12.1", optional = true }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
walkdir = "2"
dirs = "5"
compact_str = "0.8"
http = "1"
rmcp = { version = "1.7.0", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
